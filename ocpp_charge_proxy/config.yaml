name: "OCPP Charge Proxy"
description: "Virtual OCPP 1.6 chargepoint for smart tariff providers"
version: "1.0.3"
slug: "ocpp_charge_proxy"
url: "https://github.com/thewhale21/ocpp_charge_proxy"
arch:
  - aarch64
  - amd64
init: false
startup: "services"
homeassistant_api: true
ingress: true
panel_icon: "mdi:ev-station"
panel_title: "OCPP Charge Proxy"
ports:
  "8099/tcp": null
ports_description:
  "8099/tcp": "Companion integration API"
discovery:
  - ocpp_charge_proxy
image: "ghcr.io/thewhale21/{arch}-addon-ocpp-charge-proxy"
options:
  server_hostname: ""
  chargepoint_id: ""
  password: ""
  charger_model: "PLP2-0-2-2"
  charger_vendor: "Wall Box Chargers"
  charger_serial: ""
  firmware_version: "6.11.16"
  current_amps: 32
  initial_energy_wh: 0
  start_delay_s: 3
  ramp_up_s: 5
  log_level: "info"
schema:
  server_hostname: str
  chargepoint_id: str
  password: password
  charger_model: str
  charger_vendor: str
  charger_serial: str?
  firmware_version: str
  current_amps: "int(6,32)"
  initial_energy_wh: "int(0,)?"
  start_delay_s: "float(0,60)?"
  ramp_up_s: "float(0,60)?"
  log_level: list(debug|info|warning|error)
