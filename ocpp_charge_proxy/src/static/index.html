<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCPP Charge Proxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1c1c1c;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 32px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 48px;
    }
    .status-row {
      display: flex;
      justify-content: center;
      gap: 64px;
    }
    .status-item { text-align: center; }
    .status-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 12px;
    }
    .status-value {
      font-size: 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.connected {
      background: #4caf50;
      box-shadow: 0 0 8px rgba(76,175,80,0.5);
    }
    .dot.disconnected {
      background: #ef5350;
      box-shadow: 0 0 8px rgba(239,83,80,0.5);
    }
    .state-available { color: #42a5f5; }
    .state-preparing { color: #ffa726; }
    .state-charging { color: #4caf50; }
    .state-suspended { color: #ffa726; }
    .state-finishing { color: #ab47bc; }
    .state-unavailable { color: #ef5350; }
    .state-unknown { color: #888; }
    .details {
      margin: 40px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px 32px;
      max-width: 640px;
    }
    .detail .status-label { margin-bottom: 6px; }
    .detail-value { font-size: 17px; color: #fff; }
    .commands {
      margin: 36px auto 0;
      max-width: 640px;
      text-align: left;
      border-top: 1px solid #333;
      padding-top: 20px;
      display: grid;
      gap: 14px;
    }
    .command { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .command-name { color: #fff; font-size: 15px; }
    .command-meta { color: #888; font-size: 13px; }
    .muted { color: #666; }
    .warn { color: #ffa726; }
    @media (max-width: 480px) {
      .status-row { flex-direction: column; gap: 28px; }
      .container { padding: 24px 16px; }
    }
    .footer {
      margin-top: 48px;
      color: #555;
      font-size: 12px;
    }
    .error {
      color: #ef5350;
      margin-top: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OCPP Charge Proxy</h1>
    <div class="status-row">
      <div class="status-item">
        <div class="status-label">Server Connection</div>
        <div class="status-value">
          <span class="dot" id="conn-dot"></span>
          <span id="conn-text">—</span>
        </div>
      </div>
      <div class="status-item">
        <div class="status-label">Charger State</div>
        <div class="status-value">
          <span id="state-text">—</span>
        </div>
      </div>
    </div>
    <div class="details">
      <div class="detail"><div class="status-label">Power</div><div class="detail-value" id="power">—</div></div>
      <div class="detail"><div class="status-label">Energy</div><div class="detail-value" id="energy">—</div></div>
      <div class="detail"><div class="status-label">Car SoC</div><div class="detail-value" id="soc">—</div></div>
      <div class="detail"><div class="status-label">Transaction</div><div class="detail-value" id="tx">—</div></div>
      <div class="detail"><div class="status-label">Held messages</div><div class="detail-value" id="held">—</div></div>
    </div>
    <div class="commands">
      <div class="command">
        <div><div class="status-label">Last command received</div><div class="command-name" id="rx-name">—</div></div>
        <div class="command-meta" id="rx-meta"></div>
      </div>
      <div class="command">
        <div><div class="status-label">Last command sent</div><div class="command-name" id="tx-name">—</div></div>
        <div class="command-meta" id="tx-meta"></div>
      </div>
    </div>
    <div class="footer">Auto-refreshes every 5 seconds</div>
    <div class="error" id="error" style="display:none"></div>
  </div>

  <script>
    const STATE_CLASSES = {
      'Available': 'state-available',
      'Preparing': 'state-preparing',
      'Charging': 'state-charging',
      'SuspendedEV': 'state-suspended',
      'SuspendedEVSE': 'state-suspended',
      'Finishing': 'state-finishing',
      'Unavailable': 'state-unavailable',
    };

    async function refresh() {
      try {
        const resp = await fetch('./api/state');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const connected = data.connected_to_server;
        const dot = document.getElementById('conn-dot');
        const connText = document.getElementById('conn-text');
        dot.className = 'dot ' + (connected ? 'connected' : 'disconnected');
        connText.textContent = connected ? 'Connected' : 'Disconnected';
        connText.style.color = connected ? '#fff' : '#ef5350';

        const state = data.state || 'Unknown';
        const stateEl = document.getElementById('state-text');
        stateEl.textContent = state;
        stateEl.className = STATE_CLASSES[state] || 'state-unknown';

        const set = (id, text, cls) => {
          const el = document.getElementById(id);
          el.textContent = text;
          el.className = (id.endsWith('-name') ? 'command-name' : 'detail-value') + (cls ? ' ' + cls : '');
        };
        const power = Number(data.power_kw || 0);
        set('power', power.toFixed(2) + ' kW' + (data.power_source === 'entity' ? ' (sensor)' : ''));
        set('energy', Number(data.energy_kwh || 0).toLocaleString(undefined, {maximumFractionDigits: 1}) + ' kWh');
        if (data.soc_percent === null || data.soc_percent === undefined) {
          set('soc', 'Not set', 'muted');
        } else {
          set('soc', Math.round(data.soc_percent) + '%' + (data.soc_percent >= 100 ? ' (full)' : ''));
        }
        set('tx', data.transaction_id === null || data.transaction_id === undefined ? 'None' : String(data.transaction_id),
            data.transaction_id === null || data.transaction_id === undefined ? 'muted' : '');
        const held = data.held_messages || 0;
        set('held', held ? held + ' waiting' : 'None', held ? 'warn' : 'muted');

        const showCommand = (prefix, cmd) => {
          if (!cmd) { set(prefix + '-name', 'None yet', 'muted'); document.getElementById(prefix + '-meta').textContent = ''; return; }
          set(prefix + '-name', cmd.action);
          const when = cmd.timestamp ? new Date(cmd.timestamp).toLocaleTimeString() : '';
          document.getElementById(prefix + '-meta').textContent = [cmd.status, when].filter(Boolean).join(' · ');
        };
        showCommand('rx', data.last_command_received);
        showCommand('tx', data.last_command_sent);

        document.getElementById('error').style.display = 'none';
      } catch (e) {
        document.getElementById('error').textContent = 'Cannot reach add-on API';
        document.getElementById('error').style.display = 'block';
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
