---
configuration:
  server_hostname:
    name: OCPP Server Hostname
    description: >-
      The hostname of your OCPP server (e.g. ocpp.example.com).
  chargepoint_id:
    name: Chargepoint ID
    description: >-
      Your chargepoint ID for authentication with the OCPP server.
  password:
    name: OCPP Password
    description: >-
      Your password for authentication with the OCPP server.
  charger_model:
    name: Charger Model
    description: >-
      The charger model to report in the BootNotification.
  charger_vendor:
    name: Charger Vendor
    description: >-
      The charger vendor to report in the BootNotification.
  charger_serial:
    name: Charger Serial Number (optional)
    description: >-
      The charger serial number. Auto-generated on first boot if left empty.
  firmware_version:
    name: Firmware Version
    description: >-
      The firmware version to report in the BootNotification.
  current_amps:
    name: Charger Current (A)
    description: >-
      The charger current setting in amps. Valid values: 6, 10, 13, 16,
      20, 25, or 32A.
  initial_energy_wh:
    name: Initial Energy Register (Wh)
    description: >-
      Seed the energy meter with this value in watt-hours. Useful when
      migrating from an existing charger. Set to 0 for a fresh install.
      This value is applied once on startup and then cleared.
  start_delay_s:
    name: Start Delay (s)
    description: >-
      Seconds after StartTransaction before the simulated car begins drawing
      current, like a real car. Set to 0 to start instantly.
  ramp_up_s:
    name: Ramp-up Time (s)
    description: >-
      Seconds for power to rise from 0 to full after the start delay.
      Set to 0 to jump straight to full power.
  log_level:
    name: Log Level
    description: >-
      The verbosity of add-on logging.
