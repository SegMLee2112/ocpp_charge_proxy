name: Tests

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ocpp_charge_proxy/requirements*.txt

      - name: Install dependencies
        working-directory: ocpp_charge_proxy
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ocpp_charge_proxy
        run: python -m pytest tests/ -v --tb=short
